<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stop das Drags</title>
<style>
  :root{
    --bg:#fff7fb; --card:#ffffff; --text:#251b27; --muted:#806f80;
    --accent:#b43b91; --accent2:#7b3fb2; --line:#eaddea; --danger:#c6284a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff7fb,#f6efff);color:var(--text)}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 50px}
  header{text-align:center;padding:12px 0 18px}
  h1{font-size:32px;margin:4px 0 4px}
  .subtitle{color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 30px rgba(91,44,84,.08);margin:12px 0}
  .setup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
  input,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
  button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:800;cursor:pointer}
  .primary{background:var(--accent);color:white;width:100%;margin-top:14px}
  .stop{background:var(--danger);color:white;width:100%;font-size:20px;padding:16px}
  .secondary{background:#f2e8f1;color:#4c3148}
  .hidden{display:none!important}
  .letterCard{text-align:center;padding:22px}
  .label{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:800}
  #letter{font-size:112px;line-height:1;margin:8px 0 12px;font-weight:950;color:var(--accent2)}
  #timer{font-variant-numeric:tabular-nums;font-size:42px;font-weight:900}
  .timerbar{height:9px;background:#eee1ed;border-radius:20px;overflow:hidden;margin-top:12px}
  #bar{height:100%;width:100%;background:var(--accent);transition:width .2s linear}
  .questions{display:grid;gap:10px}
  .q{display:grid;grid-template-columns:1fr;gap:7px;padding:12px;background:#fffafd;border:1px solid var(--line);border-radius:15px}
  .q span{font-weight:800;font-size:14px}
  .q input{font-size:15px}
  .actions{position:sticky;bottom:12px;margin-top:14px}
  .result{text-align:center}
  .bigstop{font-size:44px;font-weight:950;color:var(--danger);margin:4px 0}
  .result p{color:var(--muted)}
  .tiny{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
  @media(max-width:520px){.setup{grid-template-columns:1fr} h1{font-size:28px} #letter{font-size:88px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>👑 Stop das Drags</h1>
  <div class="subtitle">Sorteia a letra, liga o cronômetro e você preenche até gritar STOP!</div>
</header>

<section id="setup" class="card">
  <div class="setup">
    <div>
      <label>TEMPO DA RODADA</label>
      <select id="duration">
        <option value="30">30 segundos</option>
        <option value="45">45 segundos</option>
        <option value="60" selected>60 segundos</option>
        <option value="90">90 segundos</option>
        <option value="120">2 minutos</option>
        <option value="180">3 minutos</option>
      </select>
    </div>
    <div>
      <label>LETRAS</label>
      <select id="letterMode">
        <option value="all" selected>A–Z</option>
        <option value="easy">Sem K, W, Y</option>
      </select>
    </div>
  </div>
  <button class="primary" onclick="startGame()">🎲 SORTEAR LETRA E COMEÇAR</button>
</section>

<section id="game" class="hidden">
  <div class="card letterCard">
    <div class="label">A LETRA DA RODADA É</div>
    <div id="letter">A</div>
    <div id="timer">01:00</div>
    <div class="timerbar"><div id="bar"></div></div>
  </div>

  <div class="card">
    <div class="questions" id="questions"></div>
    <div class="actions">
      <button class="stop" onclick="stopGame()">🛑 STOP!</button>
    </div>
    <div class="tiny">Pode preencher tudo e apertar STOP a qualquer momento.</div>
  </div>
</section>

<section id="result" class="card result hidden">
  <div class="bigstop">STOP! 🛑</div>
  <p id="resultText"></p>
  <button class="primary" onclick="newRound()">🎲 NOVA RODADA</button>
  <button class="secondary" style="width:100%;margin-top:8px" onclick="showSetup()">⚙️ Mudar configurações</button>
</section>
</div>

<script>
const categories = [
  "Seria cancelado por",
  "Deveria ser crime",
  "Daria treta por",
  "Minha amiga já",
  "Contas a pagar",
  "Viagem perfeita",
  "Presente que choca",
  "Marca favorita",
  "Tem na bolsa",
  "Representa o Brasil",
  "Pior drag do Brasil"
];

let timerId=null, endTime=0, total=60, currentLetter="";

function letters(){
  const all="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  return document.getElementById("letterMode").value==="easy"
    ? all.filter(x=>!["K","W","Y"].includes(x)) : all;
}
function randomLetter(){
  const a=letters();
  return a[Math.floor(Math.random()*a.length)];
}
function renderQuestions(){
  const box=document.getElementById("questions");
  box.innerHTML="";
  categories.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="q";
    div.innerHTML=`<span>${i+1}. ${c}</span><input autocomplete="off" autocapitalize="sentences" placeholder="Resposta com ${currentLetter}...">`;
    box.appendChild(div);
  });
}
function startGame(){
  currentLetter=randomLetter();
  total=parseInt(document.getElementById("duration").value,10);
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("letter").textContent=currentLetter;
  renderQuestions();
  document.querySelector(".q input").focus();
  endTime=Date.now()+total*1000;
  clearInterval(timerId);
  timerId=setInterval(updateTimer,100);
  updateTimer();
}
function updateTimer(){
  const remaining=Math.max(0,endTime-Date.now());
  const sec=Math.ceil(remaining/1000);
  const m=String(Math.floor(sec/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  document.getElementById("timer").textContent=`${m}:${s}`;
  document.getElementById("bar").style.width=(remaining/(total*1000)*100)+"%";
  if(remaining<=0){
    clearInterval(timerId);
    stopGame(true);
  }
}
function stopGame(timeout=false){
  clearInterval(timerId);
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("resultText").textContent =
    timeout ? `O tempo acabou! A letra era ${currentLetter}.` : `Rodada encerrada com a letra ${currentLetter}.`;
}
function newRound(){ startGame(); }
function showSetup(){
  clearInterval(timerId);
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("setup").classList.remove("hidden");
}
</script>
</body>
</html>
